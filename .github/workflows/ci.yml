name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify version manifests are in sync
        run: make version-check

      # The plugin depends on the CLI, never the reverse. This fails the build
      # when QLUENT_MIN_CLI_VERSION outruns what npm can actually install.
      - name: Verify the required CLI version is published to npm
        run: make cli-floor

      # Globs tests/*.sh, so a newly added test runs without touching this file.
      - name: Run the contract test suite
        run: make test
